<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estação Criança — Registro de ponto</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="rec">
  <div class="card">
    <img class="logo" src="img/logo.png" alt="Estação Criança">
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date"></div>

    <div id="s1">
      <label for="cpf" style="text-align:left">Digite o seu CPF</label>
      <div class="field"><i data-lucide="user-round"></i><input id="cpf" class="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off"></div>
      <div class="pad" id="pad"></div>
      <button class="btn big" id="ok"><i data-lucide="arrow-right"></i> Continuar</button>
    </div>

    <div id="s2" class="hidden">
      <div class="who" id="who"></div>
      <div class="next" id="next"></div>
      <div class="row2">
        <button class="btn sec big" id="cancel">Cancelar</button>
        <button class="btn ok big" id="confirm"><i data-lucide="check"></i> Registrar</button>
      </div>
    </div>

    <div id="s3" class="hidden">
      <div class="done-ic"><i data-lucide="check"></i></div>
      <div class="who" id="done"></div>
      <div class="muted" id="doneSub"></div>
    </div>

    <div id="msg"></div>
    <p class="muted" style="font-size:.78rem;margin:16px 0 0">Controle interno de ponto.</p>
  </div>
</div>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="recepcao.js"></script>
</body>
</html>
