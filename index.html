<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ponto — Recepção</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="rec">
  <div class="card">
    <h1 id="escola"></h1>
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date"></div>

    <div id="s1">
      <label for="cpf">Digite o seu CPF</label>
      <input id="cpf" class="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off">
      <div class="pad" id="pad"></div>
      <button class="btn big" id="ok">Continuar</button>
    </div>

    <div id="s2" class="hidden">
      <div class="who" id="who"></div>
      <div class="next" id="next"></div>
      <div class="row2">
        <button class="btn sec big" id="cancel">Cancelar</button>
        <button class="btn ok big" id="confirm">Registrar</button>
      </div>
    </div>

    <div id="s3" class="hidden">
      <div class="who" id="done"></div>
      <div class="muted" id="doneSub"></div>
    </div>

    <div id="msg"></div>
    <p class="muted" style="font-size:.8rem;margin-top:16px">Controle interno de ponto.</p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="recepcao.js"></script>
</body>
</html>
