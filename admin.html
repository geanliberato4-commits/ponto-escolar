<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escola Estação Criança — Painel do ponto</title>
<link rel="icon" href="favicon.ico?v=20261109" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=20261109">
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png?v=20261109">
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png?v=20261109">
<link rel="manifest" href="manifest-admin.webmanifest?v=20261109">
<meta name="theme-color" content="#0f1f4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel EC">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261110a">
</head>
<body>

<!-- Login -->
<div id="loginView" class="auth">
  <div class="auth-art">
    <div class="logo-card"><img src="img/logo.png" alt="Estação Criança"></div>
    <h2>Controle de ponto</h2>
    <p>Registros, escalas e relatórios da equipe em um só lugar.</p>
  </div>
  <div class="auth-form">
    <div class="auth-box">
      <img class="mobile-logo" src="img/logo.png" alt="Estação Criança">
      <h1>Bem-vindo(a)</h1>
      <p class="muted" style="margin:0 0 6px">Entre com o seu acesso da direção.</p>
      <label for="email">E-mail</label>
      <div class="field"><i data-lucide="mail"></i><input id="email" type="email" autocomplete="username" placeholder="seu@email.com"></div>
      <label for="senha">Senha</label>
      <div class="field"><i data-lucide="lock"></i><input id="senha" type="password" autocomplete="current-password" placeholder="Sua senha"></div>
      <div id="loginMsg"></div>
      <button class="btn big" id="entrar" style="margin-top:14px"><i data-lucide="log-in"></i> Entrar</button>
      <p class="muted" style="font-size:.8rem;text-align:center;margin-top:18px">Acesso restrito. Cada pessoa usa o próprio login.</p>
    </div>
  </div>
</div>

<!-- Painel -->
<div id="appView" class="shell hidden">
  <aside class="side" id="side">
    <div class="side-head"><div class="logo-card"><img src="img/logo.png" alt="Estação Criança"></div></div>
    <nav class="nav" id="tabs">
      <div class="nav-label">Menu</div>
      <button class="on" data-t="dash" title="Dashboard"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></button>
      <button data-t="func" title="Funcionários"><i data-lucide="users"></i><span>Funcionários</span></button>
      <button data-t="ex" title="Ex-funcionários"><i data-lucide="archive"></i><span>Ex-funcionários</span></button>
      <button data-t="reg" title="Registros de ponto"><i data-lucide="clock"></i><span>Registros de ponto</span></button>
      <button data-t="cal" title="Calendário da equipe"><i data-lucide="calendar-days"></i><span>Calendário</span></button>
      <button data-t="ocor" title="Ocorrências e abonos"><i data-lucide="file-check"></i><span>Ocorrências</span></button>
      <button data-t="rel" title="Relatórios"><i data-lucide="file-text"></i><span>Relatórios</span></button>
      <div class="nav-label">Sistema</div>
      <button data-t="esc" title="Escalas"><i data-lucide="calendar-clock"></i><span>Escalas</span></button>
      <button data-t="cfg" title="Configurações"><i data-lucide="settings"></i><span>Configurações</span></button>
    </nav>
    <div class="side-foot">
      <div class="user"><div class="avatar" id="avatar">?</div><div><b id="quemNome"></b><small id="quemPerfil"></small></div></div>
      <button class="side-btn collapse-btn" id="recolher" title="Recolher menu"><i data-lucide="panel-left-close"></i><span>Recolher menu</span></button>
      <button class="side-btn" id="sair"><i data-lucide="log-out"></i><span>Sair</span></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="content">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Abrir menu"><i data-lucide="menu"></i></button>
      <div class="school" id="escola2"></div>
      <div class="today" id="hojeTxt"></div>
    </header>
    <main id="main"></main>
  </div>
</div>

<div id="modalRoot"></div>

<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="calc.js?v=20261110a"></script>
<script src="bio.js?v=20261110a"></script>
<script src="config.js?v=20261110a"></script>
<script src="admin.js?v=20261110a"></script>
</body>
</html>
