<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ponto — Painel da direção</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginView" class="login">
  <div class="card">
    <h2 id="escola" style="margin-top:0"></h2>
    <p class="muted">Painel da direção</p>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username">
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password">
    <div id="loginMsg"></div>
    <p><button class="btn" id="entrar" style="width:100%">Entrar</button></p>
  </div>
</div>

<div id="appView" class="hidden">
  <div class="top">
    <h1 id="escola2"></h1>
    <span class="muted" id="quem"></span>
    <button class="btn sec sm" id="sair">Sair</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-t="dash">Dashboard</button>
    <button class="tab" data-t="func">Funcionários</button>
    <button class="tab" data-t="reg">Registros de ponto</button>
    <button class="tab" data-t="rel">Relatórios</button>
  </div>
  <main id="main"></main>
</div>

<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
